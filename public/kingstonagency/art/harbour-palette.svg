<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 720" role="img" aria-labelledby="title desc"><title id="title">Kingston Agency colour palette</title><desc id="desc">Five foreground and background combinations with background hex codes.</desc><g transform="translate(0 0)" font-family="Helvetica Neue, Arial, system-ui, sans-serif" fill="#16223A"><rect width="592" height="400" fill="#AEDDEA" /><text x="34" y="47" font-size="20">Navy</text><text x="34" y="73" font-size="20">on pale blue</text><text x="34" y="370" font-size="14">#AEDDEA</text></g><g transform="translate(592 0)" font-family="Helvetica Neue, Arial, system-ui, sans-serif" fill="#000000"><rect width="248" height="560" fill="#FAFAFA" /><text x="34" y="47" font-size="20">Black</text><text x="34" y="73" font-size="20">on white</text><text x="34" y="530" font-size="14">#FAFAFA</text></g><g transform="translate(0 400)" font-family="Helvetica Neue, Arial, system-ui, sans-serif" fill="#FFFFFF"><rect width="592" height="160" fill="#24566A" /><text x="34" y="47" font-size="20">White</text><text x="34" y="73" font-size="20">on dark teal</text><text x="34" y="130" font-size="14">#24566A</text></g><g transform="translate(0 560)" font-family="Helvetica Neue, Arial, system-ui, sans-serif" fill="#AEDDEA"><rect width="592" height="160" fill="#142F42" /><text x="34" y="47" font-size="20">Pale blue</text><text x="34" y="73" font-size="20">on deep blue</text><text x="34" y="130" font-size="14">#142F42</text></g><g transform="translate(592 560)" font-family="Helvetica Neue, Arial, system-ui, sans-serif" fill="#FFFFFF"><rect width="248" height="160" fill="#000000" /><text x="34" y="47" font-size="20">White</text><text x="34" y="73" font-size="20">on black</text><text x="34" y="130" font-size="14">#000000</text></g></svg>